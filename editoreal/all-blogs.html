<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Travel Blogs | editoREAL</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#17211d;font:16px/1.55 Arial,sans-serif}.wrap{width:min(1120px,92%);margin:auto}header,footer{background:#17211d;color:white;padding:20px 0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:850;letter-spacing:.12em;text-decoration:none;font-size:1.35rem;color:white}.brand span{color:#d76a42}.top a:last-child{color:white}.intro{padding:48px 0 25px}.intro h1{font-size:clamp(2.2rem,5vw,4rem);letter-spacing:-.04em;line-height:1;margin:0 0 10px}.intro p{color:#65736a}.tools{margin:22px 0}.tools input{width:100%;max-width:520px;padding:12px;border:1px solid #cdd2ca;border-radius:4px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:55px}.card{background:white;border:1px solid #e0e2dc;border-radius:7px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}.image{height:210px;background:#ddd center/cover no-repeat}.body{padding:17px;display:flex;flex-direction:column;flex:1}.body h2{font-size:1.15rem;line-height:1.25;margin:0 0 8px}.body p{color:#68746e;font-size:.92rem;margin:0 0 16px}.meta{margin-top:auto;color:#d76a42;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.empty{padding:20px 0;color:#65736a}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}.image{height:230px}.top small{display:none}}</style></head><body><header><div class="wrap top"><a class="brand" href="index.html">edito<span>REAL</span></a><a href="index.html">← Back to editoREAL</a></div></header><main class="wrap"><section class="intro"><h1>All Travel Blogs</h1><p>Every journey, in one place. Search the editoREAL travel archive.</p><div class="tools"><input id="search" type="search" placeholder="Search destinations, titles or descriptions…" aria-label="Search travel blogs"></div></section><div id="blogGrid" class="grid"><div class="empty">Loading travel blogs…</div></div></main><footer><div class="wrap">© <span id="year"></span> editoREAL · A KeralaCelebrities.com feature</div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();let allStories=[];function render(q=''){const grid=document.getElementById('blogGrid'),term=q.toLowerCase();const list=allStories.filter(s=>(s.title+' '+(s.description||'')+' '+(s.category||'')).toLowerCase().includes(term)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));grid.innerHTML='';list.forEach(s=>{const a=document.createElement('a');a.className='card';a.href=s.url;const im=document.createElement('div');im.className='image';im.style.backgroundImage='url("'+(s.image||'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80')+'")';const b=document.createElement('div');b.className='body';const h=document.createElement('h2');h.textContent=s.title;const p=document.createElement('p');p.textContent=s.description||'A travel story from editoREAL.';const m=document.createElement('div');m.className='meta';m.textContent=(s.category||'Travel story')+(s.date?' · '+s.date:'');b.append(h,p,m);a.append(im,b);grid.append(a)});if(!list.length)grid.innerHTML='<div class="empty">No matching travel stories found.</div>'}fetch('blogs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{allStories=d;render()}).catch(()=>document.getElementById('blogGrid').innerHTML='<div class="empty">Could not load blogs.json.</div>');document.getElementById('search').addEventListener('input',e=>render(e.target.value));</script></body></html>
