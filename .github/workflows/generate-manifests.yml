name: Generate site manifests

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate-manifests.py'
      - '.github/workflows/generate-manifests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate JSON manifests and SEO files
        run: python scripts/generate-manifests.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add celebrities.json movies.json sitemap.xml robots.txt

          git diff --cached --quiet || git commit -m "Auto-update manifests and SEO files"

          git push
